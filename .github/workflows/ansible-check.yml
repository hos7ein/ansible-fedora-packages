name: Ansible

on:
  pull_request:
    paths:
      - "**.yml"

jobs:
  ansible-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.3.0

  ansible-build:
    if: ${{ always() }}
    needs: [ansible-lint]
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Create test user
        run: useradd -m -s /bin/bash testuser

      - name: get repo list 1
        run: dnf repolist

      - name: Install ansible
        run: dnf install -y ansible

      - name: What ansible version do we have
        run: ansible --version

      - name: get repo list 2
        run: dnf repolist

      - name: Deploy ansible playbook
        run: ansible-playbook main-playbook.yml -e "username=testuser"
