- name: Configure Google Chrome repository
  become: true
  block:
    - name: Add Google Chrome repository
      ansible.builtin.yum_repository:
        name: google-chrome
        file: google-chrome
        description: google-chrome
        baseurl: http://dl.google.com/linux/chrome/rpm/stable/x86_64
        skip_if_unavailable: true
        enabled: true
        gpgcheck: true
        gpgkey: https://dl.google.com/linux/linux_signing_key.pub

- name: Install internet tools
  ansible.builtin.dnf:
    name:
      - firefox
      - qbittorrent
      - telegram-desktop
      - tor
      - wget
      - nethogs
      - google-chrome-stable
      - nmap
      - mtr
      - telnet
      - tcpdump
      - curl
      - arp-scan
      - sshuttle
    state: present
  retries: 3
  delay: 5
  register: internet_result
  until: internet_result is succeeded

- name: Make sure tor service is running
  ansible.builtin.systemd:
    state: started
    enabled: true
    name: tor
  when: not pre_check_dockerenv.stat.exists
