- name: Install virtualization tools
  ansible.builtin.dnf:
    name:
      - '@virtualization'             # KVM virtualization tools
      # - docker-ce                     # Docker CE
      # - docker-ce-cli
      # - containerd.io
      - VirtualBox                    # VirtualBox virtualization tool
      - virtualbox-guest-additions    # VirtualBox Extension Pack
      - podman
    state: present
  retries: 3
  delay: 5
  register: virtualization_result
  until: virtualization_result is succeeded

# Enabling the linger is required for the Podman container to be automatically started after a server reboot!
# https://mo8it.com/blog/quadlet/#dependencies
- name: Check if linger is already enabled for user {{ username }}
  sansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ username }}"
  register: virtualization_linger_status

- name: Enable linger for user {{ username }}
  ansible.builtin.command: loginctl enable-linger {{ username }}
  when:
    - pre_check_userexist.rc == 0
    - not virtualization_linger_status.stat.exists

# Add user to group (vboxusers) that allowed VirtualBox to access USB devices.
- name: Adding existing user to group vboxusers for user {{ username }}
  ansible.builtin.user:
    name: '{{ username }}'
    groups: vboxusers
    append: true
  when: pre_check_userexist.rc == 0

